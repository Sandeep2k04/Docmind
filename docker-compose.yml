services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
      - ./documind.db:/app/documind.db
  ui:
    build: .
    command: ["streamlit", "run", "streamlit_app.py", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    depends_on:
      - api
